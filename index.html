<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1e40af"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css"><title>Site Safety Inspection</title></head><body>
<header class="top no-print"><button id="backBtn" class="hide">←</button><h1 id="pageTitle">Site Safety Inspection | 地盤安全檢查系統</h1><button id="savedBtn">Saved</button></header>
<main class="wrap"><section id="homeView"><div class="panel grid"><div class="field"><label>Project Name 項目名稱</label><input id="project"></div><div class="field"><label>RSS Representative 駐地工程師代表</label><input id="inspector"></div><div class="field"><label>Date 日期</label><input id="date" type="date"></div><div class="field"><label>Weather 天氣</label><input id="weather"></div></div><h2>Main Categories / 主要檢查項目</h2><div id="categories" class="categories"></div><div class="panel actions no-print"><button class="primary" id="saveBtn">Save Inspection</button><button class="primary" id="pdfBtn">Offline PDF</button><button class="secondary" id="newBtn">New Inspection</button></div></section>
<section id="categoryView" class="hide"><div id="items"></div><div class="finish no-print"><button id="finishBtn">✓ Finish Category</button></div></section>
<section id="savedView" class="hide"><h2>Saved Reports / 已儲存報告</h2><div id="savedList"></div></section>
<section id="reportView" class="report-page hide"></section></main><div id="toast"></div><script src="app.js"></script></body></html>
